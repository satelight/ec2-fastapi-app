name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install uv pytest
          uv sync

      - name: Run tests
        run: pytest

      - name: Build artifact
        run: |
          mkdir -p build
          tar -czf build/app-${{ github.sha }}.tar.gz --exclude=.git --exclude=.venv --exclude=__pycache__ .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastapi-app
          path: build/
          retention-days: 7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Upload to S3
        run: |
          aws s3 cp build/app-${{ github.sha }}.tar.gz s3://fastapi-files-20260816/builds/app-${{ github.sha }}.tar.gz

      - name: Deploy to staging
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 13.196.191.135 >> ~/.ssh/known_hosts
          ssh ec2-user@13.196.191.135 "/home/ec2-user/deploy.sh ${{ github.sha }}"
