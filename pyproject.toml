[project]
name = "fastapi-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.11",
    "python-dotenv>=1.0",
    "boto3>=1.43.72",
    "python-multipart>=0.0.32",
    "pytest>=9.1.1",
]

[project.scripts]
fastapi-app = "fastapi_app:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
